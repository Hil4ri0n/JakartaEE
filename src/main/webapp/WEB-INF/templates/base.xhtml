<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <title>
        <ui:insert name="title">#{msg['app.title']}</ui:insert>
    </title>
    <h:outputStylesheet library="css" name="style.css"/>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</h:head>
<h:body>
    <div class="layout">

        <div class="topbar">
            #{msg['app.title']}
            <span style="float:right">
                <h:panelGroup rendered="#{securityView.loggedIn}">
                    #{msg['header.loggedIn']} #{securityView.username}
                </h:panelGroup>
                <h:panelGroup rendered="#{!securityView.loggedIn}">
                    #{msg['header.anonymous']}
                </h:panelGroup>
            </span>
        </div>

        <header class="header">
            <h:graphicImage value="#{resource[securityView.headerImage]}"
                            styleClass="header-img"/>

            <h1>
                <ui:insert name="headerTitle">
                    #{msg['header.title']}
                </ui:insert>
            </h1>
        </header>

        <nav class="nav">
            <h:link outcome="index" value="#{msg['nav.home']}"/>
            <h:link outcome="vehicles" value="#{msg['nav.vehicles']}"/>
            <h:link outcome="/rental-form" value="#{msg['nav.addRental']}"/>
        </nav>

        <main class="container">
            <div class="card">
                <ui:insert name="content"/>
            </div>
        </main>

        <footer class="footer">
            <ui:insert name="footer">
                #{msg['footer.text']}
            </ui:insert>
        </footer>
    </div>
</h:body>
</html>
