<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/base.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">#{msg['vehicles.title']}</ui:define>

    <ui:define name="content">
        <h2>#{msg['vehicles.title']}</h2>

        <h:panelGroup rendered="#{not empty vehicleListView.vehicles}">
            <h:form id="listForm">
                <h:panelGroup id="vehicleList">
                    <h:dataTable value="#{vehicleListView.vehicles}"
                                 var="v"
                                 styleClass="table">

                        <h:column>
                            <f:facet name="header">#{msg['vehicles.vin']}</f:facet>
                            <h:link outcome="vehicle">
                                <h:outputText value="#{v.vin}"/>
                                <f:param name="vin" value="#{v.vin}"/>
                            </h:link>
                        </h:column>

                        <h:column>
                            <f:facet name="header">#{msg['vehicles.brand']}</f:facet>
                            #{v.brand}
                        </h:column>

                        <h:column>
                            <f:facet name="header">#{msg['vehicles.model']}</f:facet>
                            #{v.model}
                        </h:column>

                        <h:column>
                            <f:facet name="header">#{msg['vehicles.dailyRate']}</f:facet>
                            #{v.dailyRate}
                        </h:column>

                        <h:column>
                            <f:facet name="header">#{msg['vehicles.actions']}</f:facet>

                            <h:link outcome="vehicle"
                                    value="#{msg['vehicles.details']}">
                                <f:param name="vin" value="#{v.vin}"/>
                            </h:link>
                            <h:commandLink value="#{msg['vehicles.delete']}"
                                           action="#{vehicleListView.delete(v.vin)}"
                                           rendered="#{securityView.admin}"
                                           onclick="return confirm('#{msg['vehicles.confirmDelete']}');">
                                <f:ajax render="vehicleList"/>
                            </h:commandLink>
                        </h:column>

                    </h:dataTable>
                </h:panelGroup>
            </h:form>
        </h:panelGroup>

        <h:panelGroup rendered="#{empty vehicleListView.vehicles}">
            <p>#{msg['vehicles.empty']}</p>
        </h:panelGroup>
    </ui:define>
</ui:composition>
