<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/base.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Pojazdy</ui:define>

    <ui:define name="content">
        <h2>Lista pojazdów</h2>

        <h:panelGroup rendered="#{not empty vehicleListView.vehicles}">
            <table class="table">
                <thead>
                <tr>
                    <th>VIN</th>
                    <th>Marka</th>
                    <th>Model</th>
                    <th>Stawka/dzień</th>
                    <th>Akcje</th>
                </tr>
                </thead>
                <tbody>
                <ui:repeat value="#{vehicleListView.vehicles}" var="v">
                    <tr>
                        <td>#{v.vin}</td>
                        <td>#{v.brand}</td>
                        <td>#{v.model}</td>
                        <td>#{v.dailyRate}</td>
                        <td>
                            <div class="actions">
                                <h:link outcome="vehicle" value="Szczegóły">
                                    <f:param name="vin" value="#{v.vin}"/>
                                </h:link>
                                <h:form>
                                    <h:commandButton value="Usuń"
                                                     action="#{vehicleListView.delete(v.vin)}"/>
                                </h:form>
                            </div>
                        </td>
                    </tr>
                </ui:repeat>
                </tbody>
            </table>
        </h:panelGroup>

        <h:panelGroup rendered="#{empty vehicleListView.vehicles}">
            <p>Brak pojazdów.</p>
        </h:panelGroup>
    </ui:define>
</ui:composition>
